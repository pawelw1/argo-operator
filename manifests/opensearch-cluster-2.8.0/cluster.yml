apiVersion: opensearch.opster.io/v1
kind: OpenSearchCluster
metadata:
  name: my-first-cluster
  namespace: default
spec:
  security:
    tls:
      http:
        generate: true
      transport:
        generate: true
        perNode: true

  confMgmt:
    smartScaler: true

  general:
    httpPort: 9200
    serviceName: my-first-cluster
    version: "3.2.0"
    pluginsList:
      - repository-s3
    drainDataNodes: true
    monitoring:
      enable: true
      labels:
        monitoring: prometheus
      scrapeInterval: 30s
      pluginUrl: https://github.com/opensearch-project/opensearch-prometheus-exporter/releases/download/3.2.0.0/prometheus-exporter-3.2.0.0.zip
      tlsConfig:
        insecureSkipVerify: true

  dashboards:
    service:
      type: NodePort
    tls:
      enable: true
      generate: true
    version: "3.2.0"
    enable: true
    replicas: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "200m"

  nodePools:
    - component: masters
      replicas: 3
      resources:
        requests:
          memory: "2Gi"
          cpu: "1000m"
        limits:
          memory: "2Gi"
          cpu: "1000m"
      roles:
        - cluster_manager
      persistence:
        emptyDir: {}

    - component: data
      replicas: 2
      resources:
        requests:
          memory: "2Gi"
          cpu: "1000m"
        limits:
          memory: "2Gi"
          cpu: "1000m"
      roles:
        - data
      persistence:
        pvc:
          accessModes:
            - ReadWriteOnce

